<!DOCTYPE html>
<html>
<head>
  <title>Cool Boy Sign-Up</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: 3em;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 2px 2px 4px #000;
    }

    #auth {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    input {
      width: calc(50% - 20px);
      padding: 10px;
      margin: 10px 10px 20px 0;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #ffd700;
      color: #222;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #e6c200;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    #messages p {
      margin: 5px 0;
    }

    #friendsList {
      list-style: none;
      padding: 0;
    }

    #friendsList li {
      background: rgba(255, 255, 255, 0.2);
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #friendsList li:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Add some glow effect for the title */
    h1 {
      text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
    }
  </style>
</head>
<body>
  <h1>Cool Boy Sign-Up</h1>
  
  <div id="auth">
    <h2>Register</h2>
    <input id="regUsername" placeholder="Username" />
    <input id="regPassword" type="password" placeholder="Password" />
    <button onclick="register()">Register & Login</button>
  </div>

  <div id="app" style="display:none;">
    <h2>Add Friend</h2>
    <input id="friendUsername" placeholder="Friend's Username" />
    <button onclick="addFriend()">Add Friend</button>

    <h2>Friends List</h2>
    <ul id="friendsList"></ul>

    <h2>Chat</h2>
    <div id="messages"></div>
    <input id="messageInput" placeholder="Message" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let token = '';
    let socket;
    let chatWithId = null;

    async function register() {
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;

      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      if (res.ok) {
        alert('Registered! Logging you in...');
        // Automatically log in after registration
        await loginWithCredentials(username, password);
      } else {
        const error = await res.json();
        alert('Registration failed: ' + error.message);
      }
    }

    async function loginWithCredentials(username, password) {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        document.getElementById('auth').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        // Connect socket
        socket = io();
        socket.emit('join', { token });
        socket.on('message', ({ from, message }) => {
          const messagesDiv = document.getElementById('messages');
          messagesDiv.innerHTML += `<p><b>${from}:</b> ${message}</p>`;
        });
        loadFriends();
      } else {
        alert('Login failed: ' + data.message);
      }
    }

    async function addFriend() {
      const friendUsername = document.getElementById('friendUsername').value;
      await fetch('/add-friend', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': token,
        },
        body: JSON.stringify({ friendUsername }),
      });
      loadFriends();
    }

    async function loadFriends() {
      const res = await fetch('/friends', {
        headers: { 'Authorization': token },
      });
      const data = await res.json();
      const list = document.getElementById('friendsList');
      list.innerHTML = '';
      data.friends.forEach(friend => {
        const li = document.createElement('li');
        li.textContent = friend.username;
        li.onclick = () => {
          chatWithId = friend._id;
          alert(`Chatting with ${friend.username}`);
        };
        list.appendChild(li);
      });
    }

    async function sendMessage() {
      const message = document.getElementById('messageInput').value;
      if (chatWithId) {
        socket.emit('message', { to: chatWithId, message });
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML += `<p><b>You:</b> ${message}</p>`;
        document.getElementById('messageInput').value = '';
      } else {
        alert('Select a friend to chat with by clicking their name.');
      }
    }
  </script>
</body>
</html>
