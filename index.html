<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nick & Canadian Man Chat</title>
  <style>
    body { font-family: Arial; background:#f0f0f0; margin:0; padding:20px; }
    #chat { height:60vh; overflow-y:scroll; background:white; padding:10px; border-radius:8px; }
    #input-area { margin-top:20px; display:flex; gap:10px; }
    input, button { padding:10px; font-size:16px; }
    button { background:#007bff; color:white; border:none; border-radius:5px; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>

<h2>Nick & Canadian Man Chat</h2>

<div id="chat"></div>

<div id="input-area">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type a message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  // 🔥 Replace with your Firebase config (from Firebase Console)
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const chatBox = document.getElementById("chat");

  // Load messages in real time
  db.collection("messages")
    .orderBy("timestamp")
    .onSnapshot(snapshot => {
      chatBox.innerHTML = "";
      snapshot.forEach(doc => {
        const msg = doc.data();
        const div = document.createElement("div");
        div.textContent = msg.name + ": " + msg.text;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

  // Send message
  function sendMessage() {
    const name = document.getElementById("name").value.trim();
    const text = document.getElementById("message").value.trim();
    if (!name || !text) return;

    db.collection("messages").add({
      name,
      text,
      timestamp: Date.now()
    });

    document.getElementById("message").value = "";
  }
</script>

</body>
</html>
