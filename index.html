<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    body {
      font-family: 'Orbitron', sans-serif;
      background: #0a0f1f;
      color: #00aaff;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      font-size: 32px;
      text-shadow: 0 0 10px #00aaff;
    }

    #chat {
      height: 60vh;
      overflow-y: scroll;
      background: #11182d;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #00aaff;
      box-shadow: 0 0 20px #005577;
    }

    .msg {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0d1326;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 4px solid #00aaff;
      border-radius: 6px;
      color: #cceeff;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #00aaff;
    }

    #input-area {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 2px solid #00aaff;
      background: #0d1326;
      color: #cceeff;
      flex: 1;
      outline: none;
    }

    input.error {
      border-color: #ff4444;
      box-shadow: 0 0 10px #ff4444;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #00aaff;
      color: #00111f;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px #00aaff;
    }

    button:hover {
      background: #0088cc;
      box-shadow: 0 0 15px #0088cc;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>

<h2>Chat</h2>

<div id="chat"></div>

<div id="input-area">
  <input id="name" placeholder="Your name (required)">
  
  <select id="avatar">
    <option value="https://i.imgur.com/1XKQFQp.png">Blue Bot</option>
    <option value="https://i.imgur.com/8QfQ2Qx.png">Red Bot</option>
    <option value="https://i.imgur.com/4zQZQ0Z.png">Green Bot</option>
    <option value="https://i.imgur.com/7YkqZyN.png">Skull</option>
  </select>

  <input id="message" placeholder="Type a message...">
  <button id="send">Send</button>
</div>

<script>
  // 🔥 REPLACE WITH YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const chatBox = document.getElementById("chat");
  const sendBtn = document.getElementById("send");
  const nameInput = document.getElementById("name");
  const msgInput = document.getElementById("message");
  const avatarInput = document.getElementById("avatar");

  // Real-time listener
  db.collection("messages")
    .orderBy("timestamp")
    .onSnapshot(snapshot => {
      chatBox.innerHTML = "";
      snapshot.forEach(doc => {
        const msg = doc.data();

        const div = document.createElement("div");
        div.className = "msg";

        const img = document.createElement("img");
        img.src = msg.avatar;
        img.className = "avatar";

        const text = document.createElement("span");
        text.textContent = msg.name + ": " + msg.text;

        div.appendChild(img);
        div.appendChild(text);
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

  // Send message
  sendBtn.onclick = () => {
    const name = nameInput.value.trim();
    const text = msgInput.value.trim();
    const avatar = avatarInput.value;

    if (!name) {
      nameInput.classList.add("error");
      return;
    } else {
      nameInput.classList.remove("error");
    }

    if (!text) return;

    db.collection("messages").add({
      name,
      text,
      avatar,
      timestamp: Date.now()
    });

    msgInput.value = "";
  };
</script>

</body>
</html>
